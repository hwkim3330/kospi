name: TimesFM forecast

on:
  schedule:
    # 16:40 KST (07:40 UTC), Mon–Fri — after the 15:30 KRX close
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TIMESFM_BACKEND: torch
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements.txt

      - name: Install (CPU-only torch)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r forecast/requirements.txt

      # TimesFM 3.0 weights (~2.5 GB) are cached between runs; never committed.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-timesfm-3.0-pytorch-v1

      - name: Run forecast
        run: python forecast/forecast_kospi.py

      - name: Commit forecast.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast/forecast.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "forecast: update $(date -u +%Y-%m-%d)"
            git push
          fi
